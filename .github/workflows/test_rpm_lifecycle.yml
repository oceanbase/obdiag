name: Test RPM lifecycle

on:
  push:
    branches: "*"
  pull_request:
    branches: "*"

jobs:
  rpm_lifecycle:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: 3.11

    - name: Test RPM installation, upgrade, and removal scriptlets
      run: python -m unittest discover -s test/common -p 'test_rpm_lifecycle.py' -v
