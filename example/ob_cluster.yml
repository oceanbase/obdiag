obcluster:
  ob_cluster_name: test
  # Optional; defaults to normal. Both normal and Shared-Storage are case-insensitive.
  # Use Shared-Storage for OceanSeek shared storage; gather log with scope all then includes libpalf.
  # ob_startup_mode: Shared-Storage
  db_host: 192.168.1.1
  db_port: 2881 # default 2881
  tenant_sys:
    user: root@sys # default root@sys
    password: ""
  servers:
    nodes:
      - ip: 192.168.1.1
        ssh_username: admin1
        ssh_password: ''
        home_path: /root/observer1
        data_dir: /root/observer/store1
        redo_dir: /root/observer/store1
      - ip: 192.168.1.2
        ssh_username: admin2
        ssh_password: ''
        home_path: /root/observer2
        data_dir: /root/observer/store2
        redo_dir: /root/observer/store2
      - ip: 192.168.1.3
        ssh_username: admin3
        ssh_password: ''
        home_path: /root/observer3
        data_dir: /root/observer/store3
        redo_dir: /root/observer/store3
    global:
      ssh_port: 22
