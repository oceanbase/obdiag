ocp:
  login:
    url: http://xx.xx.xx.xx:xx
    user: admin
    password: ''
obcluster:
  ob_cluster_name: test
  # Optional; defaults to normal. Both normal and Shared-Storage are case-insensitive.
  # Use Shared-Storage for OceanSeek shared storage; gather log with scope all then includes libpalf.
  # ob_startup_mode: Shared-Storage
  db_host: 192.168.1.1
  db_port: 2881 # default 2881, if the obcluster use obproxy ,please set db_port to obproxy mysql_port
  tenant_sys:
    user: root@sys # default root@sys
    password: ""
  servers:
    nodes:
      - ip: 192.168.1.1
      - ip: 192.168.1.2
      - ip: 192.168.1.3
    global:
      ssh_username: '' # your username
      ssh_password: '' # password if need
      # ssh_port: 22 # your ssh port, default 22
      # ssh_key_file: "" # your ssh-key file path if need
      # ssh_type: remote # ssh_type choice [remote, docker, kube] default remote
      # container_name: xxx # container_name for ssh_type is docker
      # The directory for oceanbase installed
      home_path: /root/observer
      # The directory for data storage. The default value is $home_path/store.
      # data_dir: /root/observer/store
      # The directory for clog, ilog, and slog. The default value is the same as the data_dir value.
      # redo_dir: /root/observer/store
obproxy:
  obproxy_cluster_name: obproxy
  servers:
    nodes:
      - ip: 192.168.1.4
      - ip: 192.168.1.5
      - ip: 192.168.1.6
    global:
      ssh_username: admin # your username
      ssh_password: '' # password if need
      # ssh_port: 22 # your ssh port, default 22
      # ssh_key_file: "" # your ssh-key file path if need
      # ssh_type: remote # ssh_type choice [remote, docker, kube] default remote
      # container_name: xxx # container_name for ssh_type is docker
      # The directory for obproxy installed
      home_path: /root/obproxy
oblogservice:
  oblogservice_cluster_name: logservice
  servers:
    nodes:
      - ip: 192.168.1.7
      - ip: 192.168.1.8
      - ip: 192.168.1.9
    global:
      # The account needs read access to logs and write access to the temporary directory. The key path is on the obdiag host.
      ssh_username: admin
      ssh_key_file: /home/admin/.ssh/id_ed25519
      ssh_port: 22
      # Supported types: remote, local, docker, kubernetes. Set container or Pod fields for the deployment.
      ssh_type: remote
      # Installation directory in the target environment; logs are read from home_path/log.
      home_path: /home/admin/oblogservice
